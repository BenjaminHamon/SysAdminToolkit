# cspell:words setuptools

[build-system]
requires = [ "setuptools >= 64" ]
build-backend = "setuptools.build_meta"

[project]
name = "benjaminhamon-sysadmin-toolkit"
version = "1.0.0+development"
description = "Toolkit for automating system administration tasks"
requires-python = ">= 3.9"

authors = [
    { name = "Benjamin Hamon", email = "development@benjaminhamon.com" }
]

maintainers = [
    { name = "Benjamin Hamon", email = "development@benjaminhamon.com" }
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "benjaminhamon-standard-extensions[all] == 1.0.0+4848b843fa",
]

[project.optional-dependencies]
all = [

]

dev = [
    "mockito ~= 1.5.4",
    "pylint ~= 3.3.6",
    "pytest ~= 8.3.5",
    "pytest-asyncio ~= 0.26.0",
    "pytest-json ~= 0.4.0",
]

[project.urls]
"Source" = "https://github.com/BenjaminHamon/SysAdminToolkit"

[tool.setuptools]
license-files = [ "../../About.md", "../../License.txt" ]
